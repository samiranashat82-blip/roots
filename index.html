<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آية مباركة</title>
    <style>
        body {
            font-family: 'Amiri', 'Traditional Arabic', serif, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 20px;
        }
        .ayah {
            font-size: 24px;
            color: #2c3e50;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .surah {
            font-size: 18px;
            color: #7f8c8d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="ayah-text" class="ayah">جاري تحميل الآية...</div>
        <div id="surah-name" class="surah"></div>
    </div>

    <script>
        // الآيات التي أرسلتها
        const ayahs = [
            { text: "بِسَلاَمَةٍ أَضْطَجعُ بَلْ أَيْضًا أَنَامُ، لأَنَّكَ أَنْتَ يَا رَبُّ مُنْفَرِدًا فِي طُمَأْنِينَةٍ تُسَكِّنُنِي", surah: "سفر المزامير 4: 8" },
            { text: "إِلهُ السَّلاَمِ سَيَسْحَقُ الشَّيْطَانَ تَحْتَ أَرْجُلِكُمْ سَرِيعًا", surah: "رسالة بولس الرسول إلى أهل رومية 16: 20" },
            { text: "لاَ تَخَافُوا. قِفُوا وَانْظُرُوا خَلاَصَ الرَّبِّ الَّذِي يَصْنَعُهُ لَكُمُ الْيَوْمَ... الرَّبُّ يُقَاتِلُ عَنْكُمْ وَأَنْتُمْ تَصْمُتُونَ", surah: "سفر الخروج 14: 13-14" }
        ];

        // اختيار آية عشوائية عند فتح الصفحة
        function showRandomAyah() {
            const randomIndex = Math.floor(Math.random() * ayahs.length);
            const selected = ayahs[randomIndex];
            
            document.getElementById('ayah-text').innerText = `"${selected.text}"`;
            document.getElementById('surah-name').innerText = selected.surah;
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = showRandomAyah;
    </script>

</body>
</html>
